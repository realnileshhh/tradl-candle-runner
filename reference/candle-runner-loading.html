<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candle Runner</title>
<!--
  Candle Runner: the waiting screen game for a running backtest.
  One file, no dependencies. Mount it in an iframe or call CandleRunner.mount(element) inline.

  Iframe integration
    <iframe id="cr-frame" src="/candle-runner-loading.html" title="Candle Runner" style="border:0;width:100%;height:440px;background:transparent"></iframe>
    The widget posts {source:'candle-runner', event:'size', height} whenever its height changes, so the host can size the iframe.
    When the report lands:  frame.contentWindow.postMessage('cr:dismiss', '*');  then remove the frame after 750 ms.

  Inline integration
    const game = CandleRunner.mount(document.getElementById('slot'));
    game.dismiss();   // when the report lands; resolves after the exit animation

  Events posted to the parent window (and passed to opts.onEvent): ready, start, first-jump, game-over {score, cause, hazards}, new-best, copied, dismissed.
  Query flags: timer=0 hides the waiting timer. embed=1 forces transparent page background (automatic inside an iframe).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Tokens read from the product's loading screen: page ground, type greys, brand greens. */
  :root{
    --cr-bg:#0a120e;
    --cr-panel:rgba(255,255,255,0.016);
    --cr-line:rgba(255,255,255,0.08);
    --cr-fg:#ffffff;
    --cr-fg-2:#d4d4d4;
    --cr-fg-3:#a3a3a3;
    --cr-fg-4:#6b7a73;
    --cr-grid:#8aa89a;
    --cr-green:#4fb37c;
    --cr-green-edge:#7ad3a0;
    --cr-green-deep:#37724e;
    --cr-mint:#a9e5c3;
    --cr-red:#dc5550;
    --cr-red-edge:#f2817b;
    --cr-neutral:#5f6d67;
    --cr-neutral-edge:#8e9c96;
    --cr-gold:#e6c46a;
    --cr-amber:#d9a441;
    --cr-bull:#efe7d6;
    --cr-bull-shade:#d4c6a6;
    --cr-bull-ink:#1c201e;
    --cr-horn:#d9c08a;
    --cr-bear:#8a5a3b;
    --cr-bear-light:#c99a74;
    --cr-bear-ink:#2a1c14;
    --cr-font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --cr-canvas-h:380px;
    color-scheme:dark;
  }
  @media (max-width:900px){ :root{ --cr-canvas-h:300px } }
  @media (max-width:600px){ :root{ --cr-canvas-h:230px } }

  html,body{ margin:0; padding:0; background:var(--cr-bg); }
  body.cr-embed{ background:transparent; }
  body{ font-family:var(--cr-font); -webkit-font-smoothing:antialiased; }

  .cr{ position:relative; width:100%; color:var(--cr-fg-3); font-family:var(--cr-font);
       user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
       transition:opacity .45s ease, transform .45s ease; }
  .cr.cr-exit{ opacity:0; transform:translateY(10px); pointer-events:none; }
  @media (prefers-reduced-motion:reduce){ .cr{ transition:opacity .2s ease; } .cr.cr-exit{ transform:none; } }

  .cr-skip{ position:absolute; left:-9999px; top:0; width:1px; height:1px; overflow:hidden; }
  .cr-skip:focus{ left:0; top:0; width:auto; height:auto; z-index:5; padding:4px 10px; border-radius:8px;
    background:var(--cr-bg); color:var(--cr-mint); font-size:13px; text-decoration:none; outline:1px solid var(--cr-line); }

  .cr-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:24px;
    font-size:14px; line-height:20px; }
  .cr-wit{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--cr-fg-3);
    opacity:0; transition:opacity .4s ease; }
  .cr-wit.show{ opacity:1; }
  .cr-sig{ color:var(--cr-green); font-weight:600; margin-left:6px; letter-spacing:-0.02em; }
  .cr-timer{ display:inline-flex; align-items:center; gap:6px; flex:none; font-size:13px; line-height:18px;
    color:var(--cr-fg-3); border:1px solid var(--cr-line); border-radius:999px; padding:2px 10px 2px 8px;
    white-space:nowrap; font-variant-numeric:tabular-nums; transition:color .3s ease, border-color .3s ease; }
  .cr-timer svg{ width:12px; height:12px; display:block; }
  .cr-timer.hot{ color:var(--cr-amber); border-color:rgba(217,164,65,0.35); }
  .cr-timer-wit{ color:inherit; opacity:.85; }
  .cr-timer-wit:empty{ display:none; }

  .cr-hud{ display:flex; justify-content:space-between; align-items:center; margin:6px 0 8px;
    font-size:12px; line-height:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--cr-fg-4); }
  .cr-hud b{ font-weight:600; font-size:14px; letter-spacing:.04em; color:var(--cr-fg); margin-left:6px;
    font-variant-numeric:tabular-nums; }
  .cr-score{ display:inline-flex; align-items:center; gap:10px; }
  .cr-note{ display:inline-flex; transform:rotate(-4deg); transform-origin:center; }
  .cr-note svg{ display:block; width:22px; height:13px; }
  .cr-note.pulse{ animation:crPulse .6s ease; }
  @keyframes crPulse{ 0%{transform:rotate(-4deg) scale(1)} 35%{transform:rotate(-12deg) scale(1.35)} 70%{transform:rotate(-2deg) scale(.94)} 100%{transform:rotate(-4deg) scale(1)} }

  .cr-panel{ position:relative; border:1px solid var(--cr-line); border-radius:12px; background:var(--cr-panel); overflow:hidden; }
  .cr-canvas{ display:block; width:100%; height:var(--cr-canvas-h); outline:none; cursor:pointer; touch-action:manipulation; }
  .cr-canvas:focus-visible{ box-shadow:inset 0 0 0 2px rgba(79,179,124,0.55); }
  .cr-live{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
</style>
</head>
<body>
<div id="cr-root"></div>

<script>
window.CandleRunner = (function () {
  'use strict';

  /* ---------- constants: physics is the single source of truth for fairness ---------- */
  var CANDLE_W = 22, SLOT = 38, PPU = 21;            // candle body width, slot pitch, pixels per price unit
  var JUMP_V = -10.2, GRAV = 0.46;                   // px per frame, px per frame squared (60 fps frame)
  var AIR_FRAMES = 2 * (-JUMP_V) / GRAV;             // 44.3 frames in the air
  var APEX = (JUMP_V * JUMP_V) / (2 * GRAV);         // 113 px
  var SPEED0 = 2.8, SPEED_MAX = 7.0, ACCEL = 0.0014; // px per frame; +0.0014 per frame reaches max in about 50 s
  var BUFFER_MS = 150, COYOTE_MS = 100;
  var LOOKAHEAD = 6;                                  // candles fully inked ahead of the bull
  var BOX_L = -16, BOX_R = 24, BOX_H = 30;            // bull hit box around its centre x and feet y
  var STEP_MAX_PX = 36;                               // tallest green step the bull walks up
  var RESTART_MS = 2600;
  var MAX_RISE_U = 1.55, WALL_MIN_SPEED = 3.0, DOUBLE_MIN_SPEED = 3.6, TRIPLE_MIN_SPEED = 4.6;
  var FIRST_HAZARD_SLOTS = 20;                        // about five seconds of running at start speed

  var WIT = [
    'Replaying four years of candles. Jump the red ones.',
    'The backtest is running. So is the bull.',
    'Wicks never hurt anyone. Bodies do.',
    'Patience is also a position.',
    'Every red candle you clear is one your strategy did not have to.'
  ];
  var OVER = {
    red:  ['Stop-loss hit. Ego intact.', 'Red candle one, bull nil.'],
    gap:  ['Gap got you. Mind the gap.', 'Fell through the gap. Indices do it too.'],
    fall: ['Ran out of chart.', 'No candle under you. Happens.'],
    wall: ['Doji wall. Indecision kills.', 'Walked straight into indecision.'],
    bear: ['A bear? In this market?', 'The bear was not a drill.']
  };
  var TIMER_WIT = [[90, 'thick order book, this one'], [30, 'still cheaper than a brokerage call']];

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function pad5(n) { n = Math.max(0, Math.floor(n)); return (n < 100000 ? ('0000' + n).slice(-5) : String(n)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function rr(ctx, x, y, w, h, r) {
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    var k = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + k, y); ctx.arcTo(x + w, y, x + w, y + h, k); ctx.arcTo(x + w, y + h, x, y + h, k);
    ctx.arcTo(x, y + h, x, y, k); ctx.arcTo(x, y, x + w, y, k); ctx.closePath();
  }
  function hex2rgb(h) {
    h = h.trim();
    if (h[0] === '#') {
      if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
      return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    }
    var m = h.match(/[\d.]+/g); return m ? [+m[0], +m[1], +m[2]] : [255, 255, 255];
  }
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  var NOTE_SVG = '<svg viewBox="0 0 30 18" aria-hidden="true"><rect x="1" y="1.5" width="28" height="15" rx="2.5" fill="#e6c46a" stroke="#9c7a2a" stroke-width="1.2"/>' +
    '<rect x="4" y="4.5" width="22" height="9" rx="1" fill="none" stroke="#9c7a2a" stroke-width=".8" opacity=".6"/>' +
    '<circle cx="15" cy="9" r="4" fill="#f4dfa3" stroke="#9c7a2a" stroke-width=".9"/>' +
    '<text x="15" y="12" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6d4e12" font-family="Inter,system-ui,sans-serif">&#8377;</text></svg>';
  var CLOCK_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6.5" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 4v2.6l1.8 1.1M4.4 1.2h3.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

  /* =================================================================== */
  function mount(host, opts) {
    opts = opts || {};
    var doc = host.ownerDocument, win = doc.defaultView;
    var inFrame = (function () { try { return win.self !== win.top; } catch (e) { return true; } })();
    var params = new URLSearchParams(win.location.search);
    var showTimer = opts.timer !== false && params.get('timer') !== '0';
    var keyScope = opts.keys || (inFrame ? 'window' : 'canvas');
    var RM = !!(win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var storageKey = opts.storageKey || 'cr-hi';
    var coarse = !!(win.matchMedia && win.matchMedia('(pointer: coarse)').matches);

    /* ---------- DOM ---------- */
    host.innerHTML =
      '<div class="cr" tabindex="-1">' +
        '<a class="cr-skip" href="#">Skip the game</a>' +
        '<div class="cr-top">' +
          '<span class="cr-wit"><span class="cr-wit-text"></span><span class="cr-sig">tl/.</span></span>' +
          '<span class="cr-timer"' + (showTimer ? '' : ' hidden') + '>' + CLOCK_SVG + '<b class="cr-clock">0:00</b><span class="cr-timer-wit"></span></span>' +
        '</div>' +
        '<div class="cr-hud">' +
          '<span class="cr-hi">Hi<b>00000</b></span>' +
          '<span class="cr-score"><span class="cr-note" aria-hidden="true">' + NOTE_SVG + '</span><span>Score<b>00000</b></span></span>' +
        '</div>' +
        '<div class="cr-panel">' +
          '<canvas class="cr-canvas" tabindex="0" role="img" aria-label="Candle Runner. A bull runs along a candlestick chart while your backtest loads. Tap, click, or press space to jump over red candles, gaps, doji walls and bears."></canvas>' +
          '<div class="cr-live" aria-live="polite"></div>' +
        '</div>' +
      '</div>';
    var root = host.querySelector('.cr');
    var canvas = root.querySelector('.cr-canvas');
    var ctx = canvas.getContext('2d', { alpha: true });
    var witEl = root.querySelector('.cr-wit'), witText = root.querySelector('.cr-wit-text');
    var timerEl = root.querySelector('.cr-timer'), clockEl = root.querySelector('.cr-clock'), timerWit = root.querySelector('.cr-timer-wit');
    var hiEl = root.querySelector('.cr-hi b'), scoreEl = root.querySelector('.cr-score b'), noteEl = root.querySelector('.cr-note');
    var liveEl = root.querySelector('.cr-live');

    /* ---------- palette from CSS tokens, so the host can theme it ---------- */
    var cs = win.getComputedStyle(root);
    function tok(name, fb) { var v = cs.getPropertyValue(name); return v ? v.trim() : fb; }
    var P = {
      grid: hex2rgb(tok('--cr-grid', '#8aa89a')),
      fg: tok('--cr-fg', '#ffffff'), fg2: tok('--cr-fg-2', '#d4d4d4'), fg3: tok('--cr-fg-3', '#a3a3a3'), fg4: tok('--cr-fg-4', '#6b7a73'),
      green: tok('--cr-green', '#4fb37c'), greenEdge: tok('--cr-green-edge', '#7ad3a0'), greenRGB: hex2rgb(tok('--cr-green', '#4fb37c')),
      red: tok('--cr-red', '#dc5550'), redEdge: tok('--cr-red-edge', '#f2817b'), redRGB: hex2rgb(tok('--cr-red', '#dc5550')),
      neutral: tok('--cr-neutral', '#5f6d67'), neutralEdge: tok('--cr-neutral-edge', '#8e9c96'), neutralRGB: hex2rgb(tok('--cr-neutral', '#5f6d67')),
      gold: tok('--cr-gold', '#e6c46a'), mint: tok('--cr-mint', '#a9e5c3'),
      bull: tok('--cr-bull', '#efe7d6'), bullShade: tok('--cr-bull-shade', '#d4c6a6'), ink: tok('--cr-bull-ink', '#1c201e'), horn: tok('--cr-horn', '#d9c08a'),
      bear: tok('--cr-bear', '#8a5a3b'), bearLight: tok('--cr-bear-light', '#c99a74'), bearInk: tok('--cr-bear-ink', '#2a1c14'),
      bgRGB: hex2rgb(tok('--cr-bg', '#0a120e')),
      font: tok('--cr-font', 'Inter, system-ui, sans-serif')
    };
    function font(w, px) { return w + ' ' + px + 'px ' + P.font; }

    /* ---------- canvas size (DPR crisp, fluid width) ---------- */
    var W = 720, H = 380, DPR = 1, BULL_CX = 142;
    function resize() {
      var cw = canvas.clientWidth || 720, ch = canvas.clientHeight || 380;
      DPR = Math.min(2, win.devicePixelRatio || 1);
      W = cw; H = ch;
      canvas.width = Math.round(cw * DPR); canvas.height = Math.round(ch * DPR);
      BULL_CX = cw < 520 ? 92 : 142;
      if (bullP != null) camHi = camTarget();
    }

    /* ---------- state ---------- */
    var seed = 1;
    function rnd() { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    function rb(a, b) { return a + rnd() * (b - a); }

    var candles, gen, speed, distance, score, hi = 0, hiAtStart = 0;
    var bullP, velY, grounded, canCoyote, lastGroundedAt, bufferedAt, fellFrom, anim, lean;
    var camHi = 0, phase = 'intro', introT = 0, startedAt = 0, overAt = 0, overCause = 'red', overLine = '', overScore = 0, isNewBest = false;
    var puffs = [], dodged = 0, jumps = 0, runs = 0, flagShown = false, dismissed = false, destroyed = false;
    var restartTimer = 0, witTimer = 0, clockTimer = 0, timerTier = -1, waitStart = performance.now();
    try { hi = +win.localStorage.getItem(storageKey) || 0; } catch (e) { hi = 0; }

    function topU(c) { return c.kind === 'up' ? Math.max(c.o, c.c) : Math.max(c.o, c.c); }
    function botU(c) { return Math.min(c.o, c.c); }
    function yOf(p) { return (camHi - p) * PPU; }
    function camTarget() { return bullP + (0.6 * H) / PPU; }
    function jumpRangePx() { return AIR_FRAMES * speed; }
    function runwayCount() { return Math.max(3, Math.ceil((jumpRangePx() + 40) / SLOT)); }

    /* ---------- spawner: the chart is the level ---------- */
    function greenAt(x, topTarget, body, jitter) {
      var c = topTarget + (jitter ? rb(-jitter, jitter) : 0);
      var o = c - body;
      return { x: x, o: o, c: c, h: c + rb(0.15, 0.7), l: o - rb(0.15, 0.7), kind: 'up', gapAfter: 0, bear: false, scored: false, id: ++uid };
    }
    var uid = 0;
    function pickMood() {
      var r = rnd(), m;
      if (r < 0.34) m = 'up'; else if (r < 0.62) m = 'down'; else m = 'chop';
      if (m === gen.mood && rnd() < 0.7) m = (m === 'chop') ? (rnd() < 0.5 ? 'up' : 'down') : 'chop';
      gen.mood = m; gen.moodLeft = m === 'chop' ? 4 + Math.floor(rnd() * 5) : 3 + Math.floor(rnd() * 4); gen.anchor = gen.price;
    }
    function spawnGreen(x) {
      var p = gen.price, c;
      if (gen.mood === 'up') {
        var body = rb(0.8, 1.5), gapDown = rb(0, 0.2);
        var o = p - gapDown, cl = Math.min(o + body, p + MAX_RISE_U);
        c = { x: x, o: o, c: cl, h: cl + rb(0.1, 0.5), l: o - rb(0.2, 0.8), kind: 'up', gapAfter: 0, bear: false, scored: false, id: ++uid };
      } else if (gen.mood === 'down') {
        var o2 = p - rb(1.0, 1.7), b2 = rb(0.3, 0.7);
        c = { x: x, o: o2, c: o2 + b2, h: o2 + b2 + rb(0.2, 0.8), l: o2 - rb(0.2, 0.9), kind: 'up', gapAfter: 0, bear: false, scored: false, id: ++uid };
      } else {
        c = greenAt(x, gen.anchor, rb(0.3, 0.8), 0.45);
      }
      gen.price = c.c; gen.moodLeft--;
      return c;
    }
    function hazardRoll(x) {
      if (gen.hazardCount === 0) {
        var minX = BULL_CX + FIRST_HAZARD_SLOTS * SLOT;
        if (x < minX) return false;
        return x >= minX + 2 * SLOT || rnd() < 0.5;
      }
      if (gen.sinceHazard < gen.extra) return false;
      var ramp = clamp((speed - SPEED0) / (SPEED_MAX - SPEED0), 0, 1);
      return rnd() < 0.5 + 0.3 * ramp;
    }
    function spawnHazard(x, last) {
      var T = gen.price, kind, c;
      if (!gen.firstRed) kind = 'red';
      else {
        var ramp0 = clamp((speed - SPEED0) / (SPEED_MAX - SPEED0), 0, 1);
        var r = rnd(), wWall = (speed >= WALL_MIN_SPEED && gen.mood !== 'up') ? 0.14 + 0.1 * ramp0 : 0, wGap = last ? 0.22 : 0, wBear = 0.18, wRed = 0.44;
        var tot = wRed + wGap + wWall + wBear; r *= tot;
        kind = r < wRed ? 'red' : r < wRed + wGap ? 'gap' : r < wRed + wGap + wWall ? 'wall' : 'bear';
      }
      if (kind === 'red') {
        var n = 1;
        if (gen.firstRed) { if (speed >= TRIPLE_MIN_SPEED && rnd() < 0.3) n = 3; else if (speed >= DOUBLE_MIN_SPEED && rnd() < 0.42) n = 2; }
        for (var k = 0; k < n; k++) {
          var o = T + rb(1.0, 1.6) - k * 0.15, cl = T - rb(0.2, 0.5);
          c = { x: x + k * SLOT, o: o, c: cl, h: o + rb(0.3, 0.8), l: cl - rb(0.2, 0.6), kind: 'red', gapAfter: 0, bear: false, scored: false, id: ++uid, first: !gen.firstRed && k === 0, streak: n };
          if (k < n - 1) candles.push(c);
        }
        gen.firstRed = true;
      } else if (kind === 'wall') {
        var top = T + rb(1.8, 2.4), bot = T - 0.1;
        c = { x: x, o: top, c: bot, h: top + rb(0.4, 0.9), l: bot - rb(0.3, 0.6), kind: 'wall', gapAfter: 0, bear: false, scored: false, id: ++uid };
      } else if (kind === 'bear') {
        c = greenAt(x, T, rb(0.4, 0.8), 0.15); c.bear = true; c.bearPhase = rnd() * 6.28;
      } else {
        last.gapAfter = Math.round(rb(36, clamp(jumpRangePx() - 70, 56, 104)));
        c = greenAt(x + last.gapAfter, T, rb(0.3, 0.6), 0.15);
      }
      gen.hold = T; gen.debt = runwayCount(); gen.sinceHazard = 0; gen.extra = Math.floor(rnd() * 3);
      gen.hazardCount++; gen.price = c.c; gen.anchor = c.c; gen.mood = 'chop'; gen.moodLeft = 2;
      candles.push(c);
      return c;
    }
    function approachIsFlat() {
      var need = speed > 4.5 ? 3 : 2, n = candles.length;
      if (n < need) return true;
      var ref = topU(candles[n - 1]);
      for (var i = n - need; i < n; i++) { var c = candles[i]; if (c.kind !== 'up' || c.bear || c.gapAfter || Math.abs(topU(c) - ref) > 0.35) return false; }
      return true;
    }
    function spawnNext() {
      var last = candles.length ? candles[candles.length - 1] : null;
      var x = last ? last.x + SLOT + last.gapAfter : BULL_CX - 2 * SLOT;
      var c;
      if (gen.debt > 0) { c = greenAt(x, gen.hold, rb(0.25, 0.6), 0.2); gen.debt--; gen.sinceHazard++; gen.price = c.c; gen.anchor = c.c; }
      else if (hazardRoll(x)) {
        if (approachIsFlat()) { spawnHazard(x, last); return candles[candles.length - 1]; }
        else { c = greenAt(x, topU(last), rb(0.3, 0.6), 0.1); gen.price = c.c; gen.anchor = c.c; gen.sinceHazard++; gen.mood = 'chop'; if (gen.moodLeft < 1) gen.moodLeft = 1; }
      }
      else { if (gen.moodLeft <= 0) pickMood(); c = spawnGreen(x); gen.sinceHazard++; }
      candles.push(c);
      return c;
    }

    function reset() {
      seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) | 0;
      candles = []; uid = 0;
      gen = { price: 100, mood: 'chop', moodLeft: 3, anchor: 100, debt: 0, hold: 100, sinceHazard: 0, hazardCount: 0, firstRed: false, extra: 2 };
      speed = SPEED0; distance = 0; score = 0; anim = 0; lean = 0;
      velY = 0; grounded = true; canCoyote = false; bufferedAt = -1e9; fellFrom = null;
      puffs = []; dodged = 0; flagShown = false;
      startedAt = performance.now(); lastGroundedAt = startedAt;
      while (candles.length < 3 || candles[candles.length - 1].x < W + 3 * SLOT) spawnNext();
      bullP = topU(supportAt(BULL_CX) || candles[2]);
      camHi = camTarget(); hiAtStart = hi;
      paintScore(true);
    }
    function paintScore(force) {

    /* ---------- HUD text ---------- */
    function setWit(txt) {

        drawScene(now, 0, null);
      } else {
        if (phase === 'play') step(now, dt);
        drawScene(now, dt, null);

      win.__crDebug = { t: +((now - startedAt) / 1000).toFixed(2), phase: phase, score: score, hi: hi, speed: +speed.toFixed(2), grounded: grounded,
        feetY: Math.round(yOf(bullP)), next: nextHazard(), cause: phase === 'over' ? overCause : null, dodged: dodged, jumps: jumps, runs: runs, W: W, H: H };
    }

    setWit(WIT[witIdx]);

    emit('ready', {}); announceSize();

    return { dismiss: dismiss, destroy: destroy, restart: restart, element: root, _debugCandles: function () { return candles.map(function (c) { return { x: c.x, o: c.o, c: c.c, h: c.h, l: c.l, kind: c.kind, gapAfter: c.gapAfter, bear: c.bear, id: c.id }; }); },
      _art: { drawBull: drawBull, drawBear: drawBear, drawCandle: drawCandle, ctx: function () { return ctx; }, palette: P } };
  }

  return { mount: mount, constants: { CANDLE_W: CANDLE_W, SLOT: SLOT, PPU: PPU, JUMP_V: JUMP_V, GRAV: GRAV, APEX: APEX, AIR_FRAMES: AIR_FRAMES, SPEED0: SPEED0, SPEED_MAX: SPEED_MAX } };
})();

(function () {
  var params = new URLSearchParams(location.search);
  var inFrame = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  if (inFrame || params.get('embed') === '1') document.body.classList.add('cr-embed');
  if (!params.has('nomount')) window.candleRunner = CandleRunner.mount(document.getElementById('cr-root'), { keys: 'window' });
})();
