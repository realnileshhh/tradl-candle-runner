    <!--
  Candle Runner: the waiting screen game for a running backtest.
  Built from github.com/realnileshhh/tradl-candle-runner (npm run build:embed). Do not edit this file: change the source.
  One file, no dependencies. Mount it in an iframe, or call CandleRunner.mount(element) inline (load with ?nomount).

  Iframe integration
    <iframe id="cr-frame" src="/candle-runner-loading.html?embed=1" title="Candle Runner" sandbox="allow-scripts"
            style="border:0;width:100%;height:439px;background:transparent"></iframe>
    The game posts {source:'candle-runner', event:'size', data:{height}} whenever its height changes, so the host can size the frame.
    When the report lands:  frame.contentWindow.postMessage('cr:results', '*');  then remove the frame after 750 ms.
    When the user leaves the conversation:  frame.contentWindow.postMessage('cr:dismiss', '*');

  Events posted to the parent window (and passed to opts.onEvent inline): ready, start, first-jump,
  game-over {score, cause, hazards, seconds}, new-best, copied, dismissed, size.
  Query flags: timer=0 hides the waiting timer. embed=1 forces a transparent page (automatic inside an iframe).
-->
